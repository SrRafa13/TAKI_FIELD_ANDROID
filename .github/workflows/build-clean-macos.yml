name: Build TAKI FIELD 7.0.0 CLEAN macOS

on:
  push:
    branches: [ "taki-field-7.0.0-macos-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TAKI_FIELD_v7.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAKI-FIELD-APK-v7.0.0-CLEAN-MACOS
          path: TAKI_FIELD_v7.0.0.apk
          retention-days: 30
